# YAML-якорь: переменные окружения, общие для server и worker, чтобы не
# дублировать один и тот же блок дважды. &app-env объявляет "закладку",
# <<: *app-env ниже — "вставь сюда всё, что там было".
#
# Обрати внимание: хосты и порты здесь ДРУГИЕ, чем в .env.example для
# локального запуска (localhost:5434, localhost:9000, localhost:5673).
# Внутри docker-сети контейнеры видят друг друга по имени сервиса
# (postgres, minio, rabbitmq) и стучатся в их "родные" порты внутри
# контейнера — 5432/9000/5672, а не в те, что мы прокинули наружу на хост.
# Проброс портов (secция ports) нужен только для доступа С ТВОЕГО МАКА,
# на общение контейнеров друг с другом он не влияет никак.
x-app-env: &app-env
  APP_ENV: production
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: gophprofile
  DB_PASSWORD: gophprofile
  DB_NAME: gophprofile
  DB_SSLMODE: disable
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: avatars
  S3_USE_SSL: "false"
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  CORS_ALLOWED_ORIGINS: "*"
  RATE_LIMIT_RPS: "5"
  RATE_LIMIT_BURST: "10"
  MIGRATIONS_PATH: /app/migrations

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: gophprofile
      POSTGRES_DB: gophprofile
    ports:
      # Слева — порт хоста, справа — порт внутри контейнера.
      # 5434 снаружи, чтобы не конфликтовать ни со стандартным 5432
      # (может быть занят локальным PostgreSQL), ни с 5433 (в моём случае
      # там уже сидел Postgres от другого проекта — gophkeeper-pg).
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Конкретная версия вместо latest — воспроизводимость: latest сегодня
    # и latest через полгода могут быть совершенно разными образами,
    # а мы хотим, чтобы окружение поднималось одинаково у всех и всегда.
    # Если конкретно этот тег к моменту запуска уже снят с Docker Hub —
    # возьми любой актуальный с https://hub.docker.com/r/minio/minio/tags.
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # веб-консоль MinIO (http://localhost:9001, minioadmin/minioadmin)
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # Нестандартные порты снаружи — по опыту с Postgres, у которого
      # стандартный 5432 и соседний 5433 уже были заняты другими проектами.
      - "5673:5672"   # AMQP — сюда стучится наше Go-приложение
      - "15673:15672" # веб-консоль (http://localhost:15673, guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: on-failure
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["./worker"]
    restart: on-failure
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
