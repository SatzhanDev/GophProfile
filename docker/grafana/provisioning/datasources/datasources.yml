# Provisioning источников данных: Grafana читает этот файл при старте и
# сама создаёт datasource'ы — без этого пришлось бы после каждого
# `docker compose down -v` заново прописывать их руками через веб-UI.
# Дашборды (следующий инкремент) будут провижениться точно так же —
# отдельным файлом в docker/grafana/provisioning/dashboards/.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
