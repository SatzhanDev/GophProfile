# Конфиг Prometheus: как часто опрашивать (scrape_interval) и кого именно
# (scrape_configs) опрашивать. Каждая цель — это "host:port", по которому
# Prometheus сам сходит на путь metrics_path (по умолчанию "/metrics") и
# заберёт текстовый вывод promhttp.Handler() — того самого, что мы
# подключили в internal/api/router.go (server) и cmd/worker/main.go (worker).
#
# Имена "server"/"worker" — это имена сервисов из docker-compose.yml:
# Prometheus работает в той же docker-сети и резолвит их точно так же,
# как наши server/worker резолвят "postgres"/"rabbitmq"/"minio"/"jaeger".
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gophprofile-server
    static_configs:
      - targets: ["server:8080"]

  - job_name: gophprofile-worker
    static_configs:
      - targets: ["worker:9100"]
