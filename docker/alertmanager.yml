# Конфиг Alertmanager. Prometheus (docker/rules.yml) только решает, что
# условие алерта выполнено, и присылает это сюда — а дальше уже Alertmanager
# отвечает за группировку похожих алертов в одно уведомление, подавление
# повторной отправки одного и того же и маршрутизацию по получателям.
global:
  resolve_timeout: 5m

route:
  receiver: "default"
  # group_by — алерты с одинаковыми значениями этих лейблов склеиваются
  # в одно уведомление вместо отдельного письма/сообщения на каждый.
  group_by: ["alertname", "job"]
  group_wait: 30s      # подождать полминуты — вдруг рядом сработают ещё алерты, чтобы прислать их одним пакетом
  group_interval: 5m   # не чаще раза в 5 минут слать уведомление по уже открытой группе
  repeat_interval: 4h  # если алерт всё ещё активен — напомнить не раньше чем через 4 часа

receivers:
  # "default" — получатель без реальной интеграции. В проде сюда
  # добавляется slack_configs / email_configs / telegram_configs (или
  # webhook_configs на свой обработчик) — секреты для них при этом
  # обычно живут не в git, а в переменных окружения/секретах Kubernetes.
  # Без единой интеграции алерты всё равно видно в UI Alertmanager
  # (http://localhost:9093) — этого достаточно, чтобы проверить, что
  # правила действительно срабатывают, не заводя реальный Slack ради учебного проекта.
  - name: "default"
