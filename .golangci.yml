version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet        # стандартные проверки компилятора (подозрительные конструкции)
    - staticcheck   # статический анализ (в v2 объединяет staticcheck/gosimple/stylecheck)
    - unused        # неиспользуемый код (переменные, функции, импорты)
    - errcheck      # необработанные ошибки
    - ineffassign   # присвоения значений, которые никогда не читаются
    - revive        # стилистика в духе golint

  settings:
    errcheck:
      # w.Write / json.Encode в HTTP-хендлерах мы осознанно игнорируем через
      # `_ = ...` (клиент всё равно не сможет ничего сделать с этой ошибкой,
      # соединение уже разрывается) — эта настройка требует явного `_ =`,
      # а не молчаливого игнорирования без ничего.
      check-blank: false

  exclusions:
    paths:
      - bin
    rules:
      # В тестовых фейках нам не нужны doc-комментарии на каждый метод —
      # revive такое требует по умолчанию для экспортированных идентификаторов.
      - path: _test\.go
        linters:
          - revive
