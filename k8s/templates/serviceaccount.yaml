{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophprofile.serviceAccountName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
# automountServiceAccountToken на самом ServiceAccount — вторая линия
# защиты сверх той же настройки на Pod'е (см. deployment-*.yaml): если
# кто-то другой создаст Pod, ссылающийся на этот ServiceAccount, и забудет
# явно отключить автомонтирование токена на своём Pod'е — здесь всё равно
# ничего не примонтируется.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
