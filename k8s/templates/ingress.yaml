{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Только server: у worker снаружи кластера смотреть нечего,
          # к нему обращаются только Prometheus (через ServiceMonitor)
          # изнутри кластера.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gophprofile.fullname" . }}-server
                port:
                  number: 80
{{- end }}
