{{- if .Values.secrets.create }}
# stringData вместо data: Kubernetes сам закодирует значения в base64 при
# создании объекта — не нужно руками считать `echo -n "..." | base64`
# для каждого поля, как это показано в примере манифеста из ТЗ
# (`data: {database-url: <base64-encoded>}`). `kubectl get secret -o yaml`
# всё равно покажет уже закодированные значения в поле data — stringData
# это просто удобный способ ЗАПИСИ, а не отдельный небезопасный режим.
#
# Если secrets.create=false — предполагается, что Secret с этим именем
# уже создан снаружи (вручную, через CI/CD, External Secrets Operator,
# Sealed Secrets и т.п.) и НЕ содержится в values.yaml открытым текстом.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.fullname" . }}-secrets
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  RABBITMQ_URL: {{ .Values.secrets.rabbitmqURL | quote }}
{{- end }}
